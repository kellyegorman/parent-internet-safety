<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parent Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard-container">

        <h1>Parent Dashboard</h1>

        <!-- Alert Section -->
        <div class="alert-row">

            <div class="alert-box">
                <strong>(1)</strong> &nbsp; New alerts:
            </div>

            <div class="search-box">
                <strong>Search:</strong> [inappropriate content]
            </div>

        </div>


        <div class="button-row">
            <button class="btn blue">Ok ?</button>
            <button class="btn green">Ignore</button>
            <button class="btn red">Block</button>
        </div>

        
        <div class="info-box">
            Screen time this week:
        </div>

        <div class="info-box">
            Most recent search:
        </div>

        <div class="info-box">
            Most common topics:
        </div>

    </div>

</body>
</html>
