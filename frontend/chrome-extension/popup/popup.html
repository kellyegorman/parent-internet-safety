    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guardian (tentative name) Browser Extension </title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <div class="login-container" id="loginContainer">
        <h2>Parent Login</h2>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="parent@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit">Log In</button>

            <p id="message"></p>
        </form>
    </div>

    <div class="login-container" id="deviceContainer" hidden>
        <h2>Welcome, Parent!</h2>
        <p>Please register this device to monitor its activity.</p>
        <form id="deviceForm">
            <div class="input-group">
                <label for="deviceName">Device Name</label>
                <input type="deviceName" id="deviceName" required>
            </div>
            <button type="submit">Register</button>

            <p id="message"></p>
        </form>
    </div>
    <script src="popup.js"></script>
</body>
</html>
